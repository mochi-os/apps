# es-419 overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through es-419, then es, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 34 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
errors.missing_app_parameter = Falta el parámetro de la app
errors.invalid_track = Track no válido
errors.missing_version_parameter = Falta el parámetro de versión
errors.not_allowed_to_install_apps = No se permite instalar apps
errors.missing_type_or_name_parameter = Falta el parámetro de tipo o nombre
errors.missing_param = Falta el parámetro de app, track o versión
errors.missing_permission_parameter = Falta el parámetro de permiso
errors.version_required = Se requiere la versión
errors.invalid_filename = Nombre de archivo no válido
