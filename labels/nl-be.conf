# nl-be overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through nl-be, then nl, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 38 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
errors.not_allowed_to_install_apps = Niet toegestaan om apps te installeren
errors.missing_type_or_name_parameter = Ontbrekende type- of naamparameter
errors.missing_param = Ontbrekende app-, traject- of versieparameter
errors.this_permission_requires_administrator_role = Deze toestemming vereist beheerdersrol
errors.failed_to_create_app_entity = App-entiteit aanmaken mislukt
